<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Syenia Azzahrama">

    <title>Form Registrasi</title>
    <style>
        fieldset:first-child{
            margin-top: 0;
        }
        fieldset{
            margin-top: 30px;
        }
        fieldset div {
            width: max-content;
        }

        .input {
            display: flex;
            margin: 18px 0;
        }

        .input span {
            margin-right: 4px;
        }

        .input>label {
            width: 250px;
        }
        form fieldset:nth-child(2) .input>label {
            width: 130px;
        }

        .input>select {
            margin-right: 4px;
        }

        .jk {
            width: max-content !important;
            margin-right: 4px;
        }

    </style>
</head>

<body>
    <h2>Form Registrasi</h2>
    <form action="get">
        <fieldset>
            <legend>Biodata</legend>
            <div>
                <div class="input">
                    <label for="nama">Nama</label>
                    <span>:</span>
                    <input id="nama" type="text" name="text_form" size="20" placeholder="Nama Anda">
                </div>
                <div class="input">
                    <label for="nama">Nomor Induk Mahasiswa (NIM)</label>
                    <span>:</span>
                    <input type="text" name="text_form" size="20" placeholder="123456789">
                </div>
                <div class="input">
                    <label for="nama">Alamat Mahasiswa</label>
                    <span class="area">:</span>
                    <textarea name="textarea_form" rows="8" cols="30" placeholder="Alamat Anda"></textarea>
                </div>
                <div class="input">
                    <label for="nama">Tanggal Lahir</label>
                    <span>:</span>
                    <select name="pilihan">
                        <option value="1" selected>01</option>
                        <option value="2">02</option>
                        <option value="3">03</option>
                        <option value="4">04</option>
                        <option value="5">05</option>
                    </select>

                    <select name="bulan">
                        <option value="1" selected>Januari</option>
                        <option value="2">Februari</option>
                        <option value="3">Maret</option>
                        <option value="4">April</option>
                        <option value="5">Mei</option>
                    </select>

                    <select name="tahun">
                        <option value="1" selected>1990</option>
                        <option value="2">1991</option>
                        <option value="3">1992</option>
                        <option value="4">1993</option>
                        <option value="5">1994</option>
                    </select>
                </div>
                <div class="input">
                    <label for="nama">Jenis Kelamin</label>
                    <span class="area">:</span>
                    <input type="radio" name="radio" value="Pria" id="Pria" chacked><label for="Pria"
                        class="jk">Pria</label>
                    <input type="radio" name="radio" value="Wanita" id="Wanita"><label for="Wanita"
                        class="jk">Wanita</label>
                </div>
                <div class="input">
                    <label for="nama">Upload Foto</label>
                    <span class="area">:</span>
                    <input type="file" name="text_form" size="20" placeholder="URL Website Anda">
                </div>
                <div class="input">
                    <label for="nama">URL Website</label>
                    <span class="area">:</span>
                    <input type="text" name="text_form" size="20" placeholder="URL Website Anda">
                </div>
                <div class="input">
                    <label for="nama">Perguruan Tinggi </label>
                    <span class="area">:</span>
                    <input type="text" name="text_form" size="20">
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>Info Akun</legend>
            <div class="input">
                <label for="nama">Email </label>
                <span class="area">:</span>
                <input type="email" name="email_form" size="20" placeholder="Email Anda">
            </div>
            <div class="input">
                <label for="nama">Username </label>
                <span class="area">:</span>
                <input type="text" name="text_form" size="20" placeholder="Username Anda">
            </div>
            <div class="input">
                <label for="nama">Password </label>
                <span class="area">:</span>
                <input type="password" name="password_form" size="20" placeholder="Password Anda">
            </div>
            <div class="input">
                <label for="nama">Ulangi Password </label>
                <span class="area">:</span>
                <input type="password" name="password_form" size="20" placeholder="Password Anda">
            </div>
        </fieldset>

        <fieldset>
            <legend>Kemampuan Dasar</legend>
            <input type="checkbox" name="HTML" value="HTML" id="cHTML"><label for="HTML">HTML</label>
            <input type="checkbox" name="CSS" value="CSS" id="CSS"><label for="CSS">CSS</label>
            <input type="checkbox" name="Javascript" value="Javascript" id="Javascript"><label
                for="Javascript">Javascript</label>
            <input type="checkbox" name="PHP" value="PHP" id="PHP"><label for="PHP">PHP</label>
            <input type="checkbox" name="MySQL" value="MySQL" id="MySQL"><label for="MySQL">MySQL</label>
            <input type="checkbox" name="Laravel" value="Laravel" id="Laravel"><label for="Laravel">Laravel</label>
            <input type="checkbox" name="React Native" value="React Native" id="React Native"><label
                for="React Native">React Native</label>
            </fieldset>
            <p>
                <input type="reset" value="Reset">
                <input type="submit" value="Submit">
                <input type="button" value="Button">
            </p>
    </form>
</body>

</html>
